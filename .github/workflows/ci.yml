name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Sync pipeline dry run (no credentials)
        run: pnpm sync --dry-run

      - run: pnpm --filter site lint

      - run: pnpm --filter site typecheck

      - run: pnpm --filter site test

      - run: pnpm --filter site build

      - run: pnpm --filter chat-server lint

      - run: pnpm --filter chat-server typecheck

      - run: pnpm --filter chat-server test

      - run: pnpm --filter chat-server build

  # Browser-level smoke test: drives the real production bundle (vite build +
  # vite preview) in headless Chromium, catching build-only breaks that the
  # jsdom suite in `verify` cannot see (see #14). Runs in its own job so the
  # Chromium provisioning stays isolated.
  #
  # Pinned to ubuntu-24.04: ubuntu-latest moved to 26.04, which the pinned
  # Playwright cannot install Chromium on ("Playwright does not support
  # chromium on ubuntu26.04-x64"). Move back to ubuntu-latest once
  # @playwright/test is bumped to a release that supports 26.04.
  site-e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm --filter site exec playwright install --with-deps chromium

      - run: pnpm --filter site test:e2e
